name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  # ---------- 1. 测试 ----------
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 语法检查
        run: |
          for f in site/js/*.js; do
            node --check "$f"
          done

      - name: 逻辑冒烟测试
        run: node tools/smoke-test.cjs .

      - name: DOM / UI 集成测试
        run: node tools/dom-test.cjs .

      - name: 真实浏览器像素测试
        run: node tools/browser-test.cjs .

  # ---------- 2. 部署 ----------
  deploy:
    name: Deploy to Cloudflare Pages
    needs: test
    runs-on: ubuntu-latest
    # 未配置 Secret 时自动跳过，避免每次推送都报红
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CF_PAGES_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 检查 Secret 是否就绪
        id: check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID，请在仓库 Settings → Secrets and variables → Actions 中添加"
            exit 1
          fi

      - name: 发布到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=pvz-web --branch=main
